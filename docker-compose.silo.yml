# Linux host networking lets the panel open inbounds created after installation.
services:
  silo:
    build:
      context: .
      dockerfile: Dockerfile
    image: silo-vip-network:local
    container_name: silo-vip-network
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${SILO_TIMEZONE:-Asia/Tehran}
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
    volumes:
      - silo-panel-db:/etc/x-ui
      - silo-panel-cert:/root/cert
      - silo-panel-acme:/root/.acme.sh
    restart: unless-stopped

volumes:
  silo-panel-db:
  silo-panel-cert:
  silo-panel-acme:
