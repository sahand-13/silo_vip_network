
name: Build and publish Linux AMD64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: linux-amd64-release
  cancel-in-progress: false

jobs:
  build:
    name: Build x-ui-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Go version specified in go.mod
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 3. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 4. Install native build dependencies
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc git curl unzip

      # 5. Build frontend
      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm ci
          npm run build

      # 6. Build Go application with baseline AMD64 compatibility
      - name: Build Go application
        env:
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v1
          CGO_ENABLED: 1
          CGO_CFLAGS: "-D_LARGEFILE64_SOURCE"
        run: |
          set -euo pipefail

          mkdir -p build

          echo "Go version:"
          go version

          echo "Go architecture settings:"
          go env GOOS GOARCH GOAMD64 CGO_ENABLED

          go build \
            -trimpath \
            -ldflags="-w -s" \
            -o build/x-ui \
            main.go

          test -s build/x-ui
          chmod +x build/x-ui

          echo "Build information:"
          go version -m build/x-ui

      # 7. Download Xray, MTG and routing databases
      - name: Prepare runtime files
        run: |
          set -euo pipefail

          chmod +x DockerInit.sh
          ./DockerInit.sh amd64 ""

          echo "Runtime files:"
          ls -lah build/bin/

          test -s build/bin/xray-linux-amd64
          test -s build/bin/mtg-linux-amd64
          test -s build/bin/geoip.dat
          test -s build/bin/geosite.dat

      # 8. Package release exactly as installer expects
      - name: Create release archive
        run: |
          set -euo pipefail

          mkdir -p package/x-ui

          # Copy application and runtime files
          cp -a build/. package/x-ui/

          # Copy installation scripts and service definitions
          cp x-ui.sh package/x-ui/
          cp x-ui.service.debian package/x-ui/
          cp x-ui.service.rhel package/x-ui/
          cp x-ui.service.arch package/x-ui/
          cp x-ui.rc package/x-ui/

          # Validate package structure
          test -s package/x-ui/x-ui
          test -s package/x-ui/x-ui.sh
          test -s package/x-ui/bin/xray-linux-amd64
          test -s package/x-ui/bin/mtg-linux-amd64

          # Set executable permissions
          chmod +x package/x-ui/x-ui
          chmod +x package/x-ui/x-ui.sh
          chmod +x package/x-ui/bin/xray-linux-amd64
          chmod +x package/x-ui/bin/mtg-linux-amd64

          # Create archive
          tar -czf x-ui-linux-amd64.tar.gz -C package x-ui

          # Generate SHA256 checksum
          sha256sum x-ui-linux-amd64.tar.gz \
            > x-ui-linux-amd64.tar.gz.sha256

          # Verify archive and checksum
          tar -tzf x-ui-linux-amd64.tar.gz
          sha256sum -c x-ui-linux-amd64.tar.gz.sha256

          echo "Release package created:"
          ls -lh x-ui-linux-amd64.tar.gz*

      # 9. Move latest tag to this commit
      - name: Update latest tag
        run: |
          set -euo pipefail

          git tag -f latest "$GITHUB_SHA"
          git push origin +refs/tags/latest

      # 10. Upload release assets
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view latest

          gh release upload latest \
            x-ui-linux-amd64.tar.gz \
            x-ui-linux-amd64.tar.gz.sha256 \
            --clobber
